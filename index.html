<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tour Booking System — Frost UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="aurora aurora--one"></div>
    <div class="aurora aurora--two"></div>

    <main class="scene">
      <header class="topbar glass reveal">
        <div class="brand">
          <span class="brand__mark"></span>
          <span>Tourera</span>
        </div>

        <nav class="menu">
          <a href="#">Тури</a>
          <a href="#">Напрямки</a>
          <a href="#">Новини</a>
          <a href="#">Контакти</a>
        </nav>

        <button class="primary-btn">Почати</button>
      </header>

      <section class="hero glass reveal delay-1">
        <div class="hero__overlay"></div>
        <div class="hero__content">
          <p class="kicker">frost edition · 2026</p>
          <h1>Explore Winter<br />Tour Booking</h1>
          <p class="hero__subtitle">
            Скляний, напівпрозорий інтерфейс з мʼякими переходами, як у референсі:
            фокус на атмосфері, преміальному вигляді та плавності.
          </p>
        </div>

        <aside class="booking glass reveal delay-2">
          <h2>Швидке бронювання</h2>
          <div class="booking__grid">
            <label>
              Напрямок
              <input value="Swiss Alps" />
            </label>
            <label>
              Дата
              <input value="24 Feb — 02 Mar" />
            </label>
            <label>
              Гостей
              <input value="2 дорослих" />
            </label>
            <label>
              Формат
              <input value="Deluxe room" />
            </label>
          </div>
          <button class="primary-btn primary-btn--wide">Забронювати</button>
        </aside>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
